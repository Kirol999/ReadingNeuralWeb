<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Neural Web · 读书成长历程</title>
<meta name="description" content="把阅读历程画成一张三维神经网络：中心节点、并列环、包含沙漏，每本书一个白色节点，每条关联一条光线。">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23000000"/><circle cx="24" cy="26" r="8" fill="%23ffffff"/><circle cx="43" cy="41" r="5.5" fill="%23ffffff" opacity="0.75"/><line x1="29" y1="30" x2="38" y2="37" stroke="%23ffffff" stroke-width="2.5" opacity="0.6"/></svg>'>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root{
  --bg:#000000;
  --ink:#ffffff;
  --dim:rgba(255,255,255,.5);
  --faint:rgba(255,255,255,.32);
  --line:rgba(255,255,255,.16);
  --line-strong:rgba(255,255,255,.42);
  --panel:rgba(7,7,7,.92);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
#scene{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
button{font-family:inherit}
:focus-visible{outline:2px solid rgba(255,255,255,.75);outline-offset:2px}

/* ===== 品牌 ===== */
.brand{position:fixed;top:24px;left:28px;z-index:30;user-select:none;pointer-events:none}
.brand h1{font-size:21px;font-weight:300;letter-spacing:.14em;text-indent:.14em;line-height:1.2}
.brand-sub{margin-top:7px;font-size:10px;font-weight:400;letter-spacing:.3em;text-indent:.3em;color:var(--faint)}
.stats{margin-top:10px;font-size:11.5px;letter-spacing:.12em;color:var(--dim)}
.stats b{font-weight:400;color:#fff}

/* ===== 提示 ===== */
.hint{position:fixed;left:28px;bottom:24px;z-index:20;font-size:11px;letter-spacing:.14em;color:var(--faint);user-select:none;pointer-events:none}
.hint-touch{display:none}

/* ===== 侧栏 ===== */
.drawer-btn{position:fixed;top:24px;right:28px;z-index:40;padding:9px 18px;font-size:12px;letter-spacing:.18em;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:border-color .25s,background .25s}
.drawer-btn:hover{border-color:var(--line-strong);background:rgba(255,255,255,.09)}
.drawer{position:fixed;top:0;right:0;height:100%;width:340px;max-width:90vw;z-index:50;background:var(--panel);border-left:1px solid var(--line);padding:26px 24px 30px;display:flex;flex-direction:column;gap:26px;overflow-y:auto;transform:translateX(105%);transition:transform .38s cubic-bezier(.22,1,.36,1)}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center}
.drawer-head h2{font-size:14px;font-weight:400;letter-spacing:.26em;text-indent:.26em}
.icon-btn{background:none;border:none;color:var(--faint);font-size:20px;line-height:1;cursor:pointer;padding:10px 12px}
.icon-btn:hover{color:#fff}
.sec h3{font-size:11px;font-weight:400;letter-spacing:.3em;color:var(--dim);padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.link-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.link-row select{flex:1;min-width:0}
select{width:100%;appearance:none;background:#0c0c0c;color:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:300;letter-spacing:.04em;cursor:pointer;outline:none}
select:hover{border-color:var(--line-strong)}
.link-arrow{color:var(--faint);font-size:12px;flex:none}
.btn{font-weight:400;letter-spacing:.14em;cursor:pointer;transition:border-color .25s,background .25s,opacity .25s;border-radius:8px;border:1px solid transparent}
.btn-ghost{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--ink);padding:10px 16px;font-size:12.5px}
.btn-ghost:hover{border-color:var(--line-strong);background:rgba(255,255,255,.09)}
.btn-ghost:disabled{opacity:.35;cursor:not-allowed}
.btn-block{width:100%}
.btn-sm{padding:7px 12px;font-size:11.5px}
.btn-solid{background:#fff;color:#000;padding:12px 26px;font-size:13.5px;border-radius:999px;border:none;cursor:pointer;letter-spacing:.2em;transition:background .25s}
.btn-solid:hover{background:rgba(255,255,255,.82)}
.book-list{list-style:none}
.book-list li{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:13px;letter-spacing:.04em}
.b-dot{width:6px;height:6px;border-radius:50%;background:#fff;flex:none}
.b-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,.82);transition:color .2s}
.book-list li:hover .b-title{color:#fff}
.badge{flex:none;font-size:9.5px;letter-spacing:.1em;border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--dim)}
.badge.core{color:#fff;border-color:rgba(255,255,255,.5)}
.badge.peer{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.3)}
.badge.child{color:var(--faint);border-color:var(--line)}
.b-meta{font-size:10.5px;color:var(--faint);flex:none;letter-spacing:.05em}
.rm{background:none;border:none;color:var(--faint);font-size:15px;line-height:1;cursor:pointer;padding:8px 10px;flex:none;min-width:34px;min-height:34px}
.rm:hover{color:#fff}
.list-actions{display:flex;gap:10px;margin-top:14px}
.count{font-size:10.5px;color:var(--faint);letter-spacing:.1em}
.save-row{display:flex;gap:8px;margin-bottom:12px}
.save-row input{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;padding:9px 12px;font-size:13px;font-weight:300;border-radius:8px;outline:none;font-family:inherit}
.save-row input::placeholder{color:rgba(255,255,255,.28)}
.save-row input:focus{border-color:var(--line-strong)}
.save-list{list-style:none;max-height:220px;overflow-y:auto}
.save-list li{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.06);font-size:12.5px}
.s-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(255,255,255,.85)}
.s-meta{font-size:10px;color:var(--faint);flex:none;letter-spacing:.04em}
.s-load{flex:none;background:none;border:1px solid var(--line);color:var(--dim);font-size:10.5px;letter-spacing:.08em;border-radius:6px;padding:4px 9px;cursor:pointer}
.s-load:hover{color:#fff;border-color:var(--line-strong)}
.s-del{flex:none;background:none;border:none;color:var(--faint);font-size:14px;cursor:pointer;padding:6px 8px;min-width:30px;min-height:30px}
.s-del:hover{color:#fff}
.save-actions{margin-top:12px}

/* ===== 悬浮信息 ===== */
.tooltip{position:fixed;transform:translate(-50%,-150%);z-index:60;pointer-events:none;background:rgba(4,4,4,.88);border:1px solid rgba(255,255,255,.24);border-radius:6px;padding:8px 13px;font-size:12.5px;letter-spacing:.06em;white-space:nowrap}
.tooltip .tt-sub{margin-top:3px;font-size:10.5px;color:var(--faint);letter-spacing:.08em}
.info-card{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:45;min-width:280px;max-width:min(540px,calc(100vw - 32px));background:var(--panel);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:18px 20px 16px}
.info-card .ic-title{font-size:17px;font-weight:400;letter-spacing:.12em;padding-right:22px}
.info-card .ic-date{margin-top:6px;font-size:11px;color:var(--faint);letter-spacing:.1em}
.info-card .ic-rel{margin-top:6px;font-size:11px;color:var(--dim);letter-spacing:.08em}
.info-card .ic-sub{margin-top:12px;font-size:11px;color:var(--dim);letter-spacing:.2em;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;letter-spacing:.04em;color:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;transition:border-color .2s;background:none;font-family:inherit}
.chip:hover{border-color:#fff}
.ic-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--faint);font-size:18px;cursor:pointer;line-height:1;padding:4px}
.ic-close:hover{color:#fff}

/* ===== toast ===== */
.toast{position:fixed;top:26px;left:50%;transform:translate(-50%,-8px);z-index:80;background:rgba(8,8,8,.92);border:1px solid rgba(255,255,255,.22);color:#fff;padding:10px 18px;font-size:12.5px;letter-spacing:.08em;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== 空态 & 兜底 ===== */
.empty-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;text-align:center;color:rgba(255,255,255,.4);font-size:15px;letter-spacing:.4em;text-indent:.4em;line-height:2.4;pointer-events:none}
.empty-hint .empty-sub{display:block;font-size:12px;color:rgba(255,255,255,.22);letter-spacing:.3em;text-indent:.3em}
.fallback{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.65);font-size:14px;letter-spacing:.15em;background:#000}

/* ===== 输入条 ===== */
.addbar-wrap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;width:min(860px,calc(100vw - 24px))}
.addbar-desc{margin-bottom:8px;text-align:center;font-size:10.5px;letter-spacing:.18em;color:rgba(255,255,255,.28);user-select:none;pointer-events:none}
.addbar{display:flex;gap:8px;align-items:center}
.addbar select{flex:none;width:auto;padding:11px 12px;font-size:13px}
.addbar .kind-sel{min-width:88px}
.addbar .ref-sel{min-width:132px;max-width:170px}
.addbar input{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;padding:12px 18px;font-size:14px;font-weight:300;letter-spacing:.06em;border-radius:999px;outline:none;transition:border-color .25s;font-family:inherit}
.addbar input::placeholder{color:rgba(255,255,255,.28)}
.addbar input:focus{border-color:var(--line-strong)}
.addbar .btn-solid{flex:none}

/* ===== 响应式 ===== */
@media (max-width:720px){
  .brand{top:18px;left:18px}
  .brand h1{font-size:17px}
  .brand-sub{letter-spacing:.4em}
  .stats{margin-top:8px;font-size:10.5px}
  .drawer-btn{top:18px;right:18px;padding:8px 14px;font-size:11px}
  .hint-mouse{display:none}
  .hint-touch{display:block;left:50%;right:auto;transform:translateX(-50%);bottom:172px;font-size:10px}
  .addbar-wrap{bottom:16px;width:calc(100vw - 20px)}
  .addbar-desc{font-size:9.5px;letter-spacing:.12em}
  .addbar{flex-wrap:wrap}
  .addbar .kind-sel{flex:1;min-width:0}
  .addbar .ref-sel{flex:1;min-width:0;max-width:none}
  .addbar input{flex:1 1 100%;order:3;font-size:16px}
  .addbar .btn-solid{order:4}
  .book-list li{font-size:14px}
  .b-meta{font-size:11px}
  .info-card{bottom:180px}
}
@media (prefers-reduced-motion: reduce){
  .drawer{transition:none}
  .toast{transition:opacity .15s}
}
</style>
</head>
<body>

<!-- ===== 3D 场景 ===== -->
<canvas id="scene" aria-hidden="true"></canvas>

<!-- ===== 顶部品牌与统计 ===== -->
<header class="brand">
  <h1>Reading Neural Web</h1>
  <p class="brand-sub">读书成长历程</p>
  <p class="stats" id="stats"><b>0</b> 本书 · <b>0</b> 条关联</p>
</header>

<!-- ===== 操作提示 ===== -->
<p class="hint hint-mouse">拖拽旋转 · 右键设旋转中心 · 滚轮缩放 · 悬停看书名</p>
<p class="hint hint-touch">单指旋转 · 双指缩放 · 轻点查看详情</p>

<!-- ===== 侧栏：书单与关联 ===== -->
<button class="drawer-btn" id="drawerBtn" aria-expanded="false" aria-controls="drawer">书单与关联</button>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>书单与关联</h2>
    <button class="icon-btn" id="drawerClose" aria-label="关闭面板">×</button>
  </div>
  <section class="sec">
    <h3>手动建立关联</h3>
    <div class="link-row">
      <select id="linkFrom" aria-label="关联起点书籍"></select>
      <span class="link-arrow">→</span>
      <select id="linkTo" aria-label="关联终点书籍"></select>
    </div>
    <button class="btn btn-ghost btn-block" id="linkBtn" disabled>建立关联</button>
  </section>
  <section class="sec">
    <h3>书单 <span class="count" id="listCount"></span></h3>
    <ul class="book-list" id="bookList"></ul>
    <div class="list-actions">
      <button class="btn btn-ghost btn-sm" id="clearBtn">清空全部</button>
      <button class="btn btn-ghost btn-sm" id="sampleBtn">恢复示例</button>
    </div>
  </section>
  <section class="sec">
    <h3>存档与新建</h3>
    <div class="save-row">
      <input id="saveName" type="text" maxlength="20" placeholder="存档名称" autocomplete="off">
      <button class="btn btn-ghost btn-sm" id="saveBtn">保存当前</button>
    </div>
    <ul class="save-list" id="saveList"></ul>
    <div class="save-actions">
      <button class="btn btn-ghost btn-sm btn-block" id="newBtn">新建神经网络</button>
    </div>
  </section>
</aside>

<!-- ===== 悬浮层 ===== -->
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="info-card" id="infoCard" hidden></div>
<div class="toast" id="toast" role="status"></div>
<div class="empty-hint" id="emptyHint" hidden>
  <span>图网尚空</span>
  <span class="empty-sub">先添加一个中心节点，再围绕它构建并列与包含</span>
</div>
<div class="fallback" id="fallback" hidden>三维场景初始化失败，请检查网络或浏览器 WebGL 支持后刷新</div>

<!-- ===== 底部添加 ===== -->
<div class="addbar-wrap">
  <p class="addbar-desc">中心 = 主节点 · 并列 = 同层围环 · 包含 = 上下延伸成沙漏</p>
  <div class="addbar">
    <select class="kind-sel" id="kindSel" aria-label="关系类型">
      <option value="core">中心</option>
      <option value="peer">并列</option>
      <option value="child">包含</option>
    </select>
    <select class="ref-sel" id="refSel" aria-label="参照节点" disabled><option value="">选择参照</option></select>
    <input id="bookInput" type="text" maxlength="40" placeholder="输入书名，回车添加节点" autocomplete="off" spellcheck="false">
    <button class="btn btn-solid" id="addBtn">添加</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';

/* ================= 数据模型 ================= */
var KEY='reading-neural-web-v1';
var SAVES_KEY='reading-neural-web-saves';
var KIND_LABEL={core:'中心',peer:'并列',child:'包含'};
var CONFIG={coreR:5.2,peerR:2.4,childH:1.9,childR0:1.3,childDR:0.8};

/* 示例数据：演示 中心 / 并列 / 包含 / 沙漏 */
var SAMPLE=[
  {t:'物理学',k:'core',p:null,l:0},
  {t:'化学',k:'peer',p:1,l:0},
  {t:'数学',k:'peer',p:1,l:0},
  {t:'量子力学',k:'child',p:1,l:1},
  {t:'相对论',k:'child',p:1,l:1},
  {t:'天体物理',k:'child',p:4,l:2},
  {t:'文学',k:'core',p:null,l:0},
  {t:'历史学',k:'peer',p:7,l:0},
  {t:'科幻',k:'child',p:7,l:1},
  {t:'诗歌',k:'child',p:7,l:1},
  {t:'《三体》',k:'child',p:9,l:2}
];
var SAMPLE_MANUAL=[[2,8]];

var state={books:[],manual:[],selId:null,seq:1};
var hoverId=null;
var linkCache=[];

/* ================= DOM ================= */
function $(id){return document.getElementById(id);}
var sceneEl=$('scene'),tooltip=$('tooltip'),infoCard=$('infoCard'),toastEl=$('toast'),
    statsEl=$('stats'),emptyHint=$('emptyHint'),bookInput=$('bookInput'),
    bookList=$('bookList'),linkFrom=$('linkFrom'),linkTo=$('linkTo'),linkBtn=$('linkBtn'),
    drawer=$('drawer'),drawerBtn=$('drawerBtn'),drawerClose=$('drawerClose'),
    listCount=$('listCount'),fallback=$('fallback'),
    kindSel=$('kindSel'),refSel=$('refSel'),
    saveName=$('saveName'),saveBtn=$('saveBtn'),saveList=$('saveList'),newBtn=$('newBtn');

var reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= Three.js 初始化 ================= */
var renderer,scene,camera,controls,points,linksMesh,hlLinks,flLinks,
    ringSpr,ringLife=0,flashes=[];
var RING_DUR=0.85;

try{
  renderer=new THREE.WebGLRenderer({canvas:sceneEl,antialias:true,powerPreference:'high-performance'});
}catch(e){
  fallback.hidden=false;
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setClearColor(0x000000,1);

scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(50,1,0.1,300);
controls=new THREE.OrbitControls(camera,sceneEl);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=5;controls.maxDistance=60;
controls.minPolarAngle=0.12;controls.maxPolarAngle=Math.PI*0.88;

function makeTex(fn){
  var c=document.createElement('canvas');c.width=c.height=128;
  var g=c.getContext('2d');fn(g);
  return new THREE.CanvasTexture(c);
}
var glowTex=makeTex(function(g){
  var gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.28,'rgba(255,255,255,0.72)');
  gr.addColorStop(0.62,'rgba(255,255,255,0.14)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
});
var ringTex=makeTex(function(g){
  var gr=g.createRadialGradient(64,64,44,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,0)');
  gr.addColorStop(0.72,'rgba(255,255,255,0)');
  gr.addColorStop(0.8,'rgba(255,255,255,0.9)');
  gr.addColorStop(0.9,'rgba(255,255,255,0)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
});

/* 节点（所有书） */
var pointMat=new THREE.PointsMaterial({map:glowTex,color:0xffffff,size:0.9,sizeAttenuation:true,transparent:true,opacity:0.95,depthWrite:false,blending:THREE.AdditiveBlending});
points=new THREE.Points(new THREE.BufferGeometry(),pointMat);
points.frustumCulled=false;
scene.add(points);

/* 关联线（常规） */
var lineMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.24,depthWrite:false,blending:THREE.AdditiveBlending});
linksMesh=new THREE.LineSegments(new THREE.BufferGeometry(),lineMat);
linksMesh.frustumCulled=false;
scene.add(linksMesh);

/* 关联线（悬停/选中高亮） */
var hlMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.9,depthWrite:false,blending:THREE.AdditiveBlending});
hlLinks=new THREE.LineSegments(new THREE.BufferGeometry(),hlMat);
hlLinks.visible=false;hlLinks.frustumCulled=false;scene.add(hlLinks);

/* 关联线（新建闪烁） */
var flMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:1,depthWrite:false,blending:THREE.AdditiveBlending});
flLinks=new THREE.LineSegments(new THREE.BufferGeometry(),flMat);
flLinks.visible=false;flLinks.frustumCulled=false;scene.add(flLinks);

function makeSprite(tex,scale,op){
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:0xffffff,transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending}));
  s.scale.setScalar(scale);s.visible=false;scene.add(s);
  return s;
}
var hoverSpr=makeSprite(glowTex,1.7,0.95);
var selSpr=makeSprite(ringTex,2.4,0.9);
ringSpr=makeSprite(ringTex,0.4,1);

/* ================= 几何同步 ================= */
function bookById(id){
  for(var i=0;i<state.books.length;i++)if(state.books[i].id===id)return state.books[i];
  return null;
}
function syncPointGeo(){
  var arr=new Float32Array(state.books.length*3);
  for(var i=0;i<state.books.length;i++){
    var b=state.books[i];
    arr[i*3]=b.pos.x;arr[i*3+1]=b.pos.y;arr[i*3+2]=b.pos.z;
  }
  points.geometry.setAttribute('position',new THREE.BufferAttribute(arr,3));
  points.geometry.boundingSphere=null;
}
function fillLinkArr(attr,list){
  var arr=attr.array,i=0;
  for(var k=0;k<list.length;k++){
    var l=list[k],a=bookById(l.from),b=bookById(l.to);
    if(!a||!b)continue;
    arr[i++]=a.pos.x;arr[i++]=a.pos.y;arr[i++]=a.pos.z;
    arr[i++]=b.pos.x;arr[i++]=b.pos.y;arr[i++]=b.pos.z;
  }
  attr.needsUpdate=true;
}
function ensureAttr(mesh,count){
  var attr=mesh.geometry.getAttribute('position');
  if(!attr||attr.count!==count*2){
    mesh.geometry.setAttribute('position',new THREE.BufferAttribute(new Float32Array(count*6),3));
    mesh.geometry.boundingSphere=null;
    attr=mesh.geometry.getAttribute('position');
  }
  return attr;
}
function syncLinkGeo(){
  var attr=ensureAttr(linksMesh,linkCache.length);
  fillLinkArr(attr,linkCache);
}
function syncHlGeo(){
  var id=hoverId!==null?hoverId:state.selId;
  if(id===null){hlLinks.visible=false;return;}
  var es=linkCache.filter(function(l){return l.from===id||l.to===id;});
  var attr=ensureAttr(hlLinks,es.length);
  fillLinkArr(attr,es);
  hlLinks.visible=true;
}
function syncFlashGeo(now){
  flashes=flashes.filter(function(f){return f.until>now;});
  if(!flashes.length){flLinks.visible=false;return;}
  var attr=ensureAttr(flLinks,flashes.length);
  fillLinkArr(attr,flashes);
  flLinks.visible=true;
}

/* ================= 布局引擎 ================= */
function angleSeed(id){
  var x=Math.sin(id*127.1)*43758.5453;
  return (x-Math.floor(x))*Math.PI*2;
}
function computeLayout(){
  var cores=[],children={};
  state.books.forEach(function(b){children[b.id]=[];});
  state.books.forEach(function(b){
    if(b.kind!=='core')children[b.parentId].push(b);
    else cores.push(b);
  });
  var n=cores.length;
  cores.forEach(function(b,i){
    if(n===1)b.base.set(0,0,0);
    else{
      var a=i/n*Math.PI*2;
      b.base.set(Math.cos(a)*CONFIG.coreR,0,Math.sin(a)*CONFIG.coreR);
    }
    placeChildren(b,children);
  });
}
function placeChildren(p,children){
  var kids=children[p.id]||[];
  if(!kids.length)return;
  var peers=kids.filter(function(k){return k.kind==='peer';});
  var subs=kids.filter(function(k){return k.kind==='child';});
  /* 并列：绕父点同一平面围成圆环 */
  if(peers.length){
    var R=Math.max(CONFIG.peerR,peers.length*0.42);
    var off=angleSeed(p.id);
    peers.forEach(function(q,i){
      var a=off+i/peers.length*Math.PI*2;
      q.base.set(p.base.x+Math.cos(a)*R,p.base.y,p.base.z+Math.sin(a)*R);
    });
    peers.forEach(function(q){placeChildren(q,children);});
  }
  /* 包含：上下逐层延伸，形成沙漏 */
  if(subs.length){
    var byLevel={};
    subs.forEach(function(s){
      var l=s.level||1;
      (byLevel[l]=byLevel[l]||[]).push(s);
    });
    Object.keys(byLevel).forEach(function(lk){
      var L=+lk,arr=byLevel[lk];
      var R=CONFIG.childR0+(L-1)*CONFIG.childDR;
      var h=L*CONFIG.childH;
      var off=angleSeed(p.id+L);
      arr.forEach(function(s,i){
        var a=off+i/arr.length*Math.PI*2;
        var up=i%2===0;
        s.base.set(
          p.base.x+Math.cos(a)*R,
          p.base.y+(up?h:-h),
          p.base.z+Math.sin(a)*R
        );
      });
      arr.forEach(function(s){placeChildren(s,children);});
    });
  }
}
function autoLinks(){
  var list=[];
  var groups={};
  state.books.forEach(function(b){
    if(b.kind==='peer')(groups[b.parentId]=groups[b.parentId]||[]).push(b.id);
  });
  Object.keys(groups).forEach(function(g){
    var arr=groups[g];
    for(var i=0;i<arr.length;i++)list.push({from:arr[i],to:arr[(i+1)%arr.length],auto:true});
  });
  state.books.forEach(function(b){
    if(b.kind==='child'&&b.parentId!==null)list.push({from:b.parentId,to:b.id,auto:true});
  });
  return list;
}
function rebuildLinksCache(){
  linkCache=autoLinks().concat(state.manual.map(function(p){return {from:p[0],to:p[1]};}));
}
function rebuildGraph(){
  rebuildLinksCache();
  syncPointGeo();syncLinkGeo();syncHlGeo();
}

/* ================= 操作 ================= */
function findBookByTitle(title){
  for(var i=0;i<state.books.length;i++){
    if(state.books[i].title.toLowerCase()===title.toLowerCase())return state.books[i];
  }
  return null;
}
function makeBook(title,kind,refId){
  var ref=refId!==null?bookById(refId):null;
  var level=0;
  if(kind==='peer')level=ref?ref.level:0;
  if(kind==='child')level=ref?ref.level+1:1;
  return {
    id:state.seq++,
    title:title,
    kind:kind,
    parentId:kind==='core'?null:refId,
    level:level,
    base:new THREE.Vector3(0,0,0),
    pos:new THREE.Vector3(0,0,0),
    amp:0.08+Math.random()*0.12,
    freq:0.3+Math.random()*0.34,
    phase:[Math.random()*Math.PI*2,Math.random()*Math.PI*2,Math.random()*Math.PI*2],
    addedAt:Date.now()
  };
}
function addBook(){
  var title=bookInput.value.trim().replace(/\s+/g,' ');
  if(!title)return;
  var kind=kindSel.value;
  var refId=kind==='core'?null:(refSel.value?+refSel.value:null);
  if(kind!=='core'&&refId===null){toast('请先选择参照节点');return;}
  var ex=findBookByTitle(title);
  if(ex){toast('《'+title+'》已存在');focusBook(ex.id);bookInput.value='';return;}
  var b=makeBook(title,kind,refId);
  state.books.push(b);
  computeLayout();
  rebuildGraph();save();updateUI();
  ringAt(b.base);
  focusBook(b.id);
  bookInput.value='';
  toast('已添加'+KIND_LABEL[kind]+'节点《'+title+'》');
}
function linkBooks(){
  var f=+linkFrom.value,t=+linkTo.value;
  if(!f||!t){toast('请先选择两本书');return;}
  if(f===t){toast('请选择两本不同的书');return;}
  if(linkCache.some(function(l){return (l.from===f&&l.to===t)||(l.from===t&&l.to===f);})){
    toast('该关联已存在');return;
  }
  state.manual.push([f,t]);
  rebuildGraph();save();updateUI();
  flashes.push({from:f,to:t,until:performance.now()+1500});
  toast('已建立关联');
}
function descendantsOf(id){
  var out=[id],queue=[id];
  while(queue.length){
    var cur=queue.shift();
    state.books.forEach(function(b){
      if(b.parentId===cur&&out.indexOf(b.id)<0){out.push(b.id);queue.push(b.id);}
    });
  }
  return out;
}
function removeBook(id){
  var b=bookById(id);if(!b)return;
  var ids=descendantsOf(id);
  state.books=state.books.filter(function(x){return ids.indexOf(x.id)<0;});
  state.manual=state.manual.filter(function(l){return ids.indexOf(l[0])<0&&ids.indexOf(l[1])<0;});
  flashes=[];
  if(hoverId!==null&&ids.indexOf(hoverId)>=0)setHover(null);
  if(state.selId!==null&&ids.indexOf(state.selId)>=0)setSelected(null);
  computeLayout();
  rebuildGraph();save();updateUI();
  toast('已移除《'+b.title+'》及其子节点');
}
function clearAll(){
  state.books=[];state.manual=[];flashes=[];
  setHover(null);setSelected(null);
  rebuildGraph();save();updateUI();
  toast('已清空全部');
}
function loadSamples(silent){
  var now=Date.now();
  state.books=SAMPLE.map(function(s,i){
    return {
      id:i+1,title:s.t,kind:s.k,parentId:s.p,level:s.l,
      base:new THREE.Vector3(0,0,0),
      pos:new THREE.Vector3(0,0,0),
      amp:0.08+Math.random()*0.12,
      freq:0.3+Math.random()*0.34,
      phase:[Math.random()*Math.PI*2,Math.random()*Math.PI*2,Math.random()*Math.PI*2],
      addedAt:now-(SAMPLE.length-i)*86400000*3
    };
  });
  state.seq=state.books.length+1;
  state.manual=SAMPLE_MANUAL.map(function(p){return [p[0],p[1]];});
  flashes=[];setHover(null);setSelected(null);
  computeLayout();
  state.books.forEach(function(b){b.pos.copy(b.base);});
  rebuildGraph();save();updateUI();
  if(!silent)toast('已恢复示例数据');
}

/* ================= 持久化 ================= */
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({
      books:state.books.map(function(b){
        return {id:b.id,title:b.title,kind:b.kind,parentId:b.parentId,level:b.level,addedAt:b.addedAt};
      }),
      manual:state.manual
    }));
  }catch(e){}
}
function buildBookFromRaw(b){
  return {
    id:b.id,
    title:b.title,
    kind:['core','peer','child'].indexOf(b.kind)>=0?b.kind:'core',
    parentId:(b.parentId===null||b.parentId===undefined)?null:b.parentId,
    level:b.level||0,
    base:new THREE.Vector3(0,0,0),
    pos:new THREE.Vector3(0,0,0),
    amp:0.08+Math.random()*0.12,
    freq:0.3+Math.random()*0.34,
    phase:[Math.random()*Math.PI*2,Math.random()*Math.PI*2,Math.random()*Math.PI*2],
    addedAt:b.addedAt||Date.now()
  };
}
function importData(d){
  if(!d||!Array.isArray(d.books)||!d.books.length)return false;
  state.books=d.books.map(buildBookFromRaw);
  state.manual=(d.manual||[]).filter(function(l){return bookById(l[0])&&bookById(l[1]);});
  state.seq=state.books.reduce(function(m,b){return Math.max(m,b.id);},0)+1;
  computeLayout();
  state.books.forEach(function(b){b.pos.copy(b.base);});
  rebuildGraph();
  return true;
}
function load(){
  var d=null;
  try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  return importData(d);
}

/* ================= 存档管理 ================= */
function getSaves(){
  try{var d=JSON.parse(localStorage.getItem(SAVES_KEY));return Array.isArray(d)?d:[];}catch(e){return [];}
}
function putSaves(list){
  try{localStorage.setItem(SAVES_KEY,JSON.stringify(list));}catch(e){}
}
function exportData(){
  return {
    books:state.books.map(function(b){
      return {id:b.id,title:b.title,kind:b.kind,parentId:b.parentId,level:b.level,addedAt:b.addedAt};
    }),
    manual:state.manual
  };
}
function saveCurrentAs(name){
  name=(name||'').trim();
  if(!name){toast('请输入存档名称');return;}
  var saves=getSaves().filter(function(s){return s.name!==name;});
  saves.unshift({name:name,savedAt:Date.now(),data:exportData()});
  putSaves(saves);
  renderSaves();
  toast('已保存存档「'+name+'」');
}
function loadSave(name){
  var saves=getSaves(),s=null;
  for(var i=0;i<saves.length;i++)if(saves[i].name===name)s=saves[i];
  if(!s){toast('未找到存档「'+name+'」');return;}
  setHover(null);setSelected(null);flashes=[];
  if(!importData(s.data)){toast('存档数据无效');return;}
  rebuildGraph();save();updateUI();
  fitCamera();
  toast('已载入存档「'+name+'」');
}
function deleteSave(name){
  putSaves(getSaves().filter(function(s){return s.name!==name;}));
  renderSaves();
  toast('已删除存档「'+name+'」');
}
function newNetwork(){
  var had=state.books.length>0;
  if(had){
    var d=new Date();
    var label='自动备份 '+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    var saves=getSaves().filter(function(s){return s.name!==label;});
    saves.unshift({name:label,savedAt:Date.now(),data:exportData()});
    putSaves(saves);
    renderSaves();
  }
  clearAll();
  toast(had?'已新建空白网络，原内容已自动备份':'已新建空白网络');
}
function renderSaves(){
  var saves=getSaves();
  if(!saves.length){
    saveList.innerHTML='<li class="b-meta" style="border:none;cursor:default;padding:4px 2px">暂无存档</li>';
    return;
  }
  var html='';
  for(var i=0;i<saves.length;i++){
    var s=saves[i];
    var n=(s.data&&Array.isArray(s.data.books))?s.data.books.length:0;
    var d=new Date(s.savedAt);
    html+='<li><span class="s-name">'+esc(s.name)+'</span><span class="s-meta">'+n+' 节点 · '+d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+'</span>'+
      '<button class="s-load" data-load="'+esc(s.name)+'">载入</button>'+
      '<button class="s-del" data-del="'+esc(s.name)+'" aria-label="删除存档">×</button></li>';
  }
  saveList.innerHTML=html;
  var loads=saveList.querySelectorAll('.s-load');
  for(var j=0;j<loads.length;j++){
    (function(b){b.onclick=function(e){e.stopPropagation();loadSave(b.getAttribute('data-load'));};})(loads[j]);
  }
  var dels=saveList.querySelectorAll('.s-del');
  for(var k=0;k<dels.length;k++){
    (function(b){b.onclick=function(e){e.stopPropagation();deleteSave(b.getAttribute('data-del'));};})(dels[k]);
  }
}

/* ================= 相机取景与聚焦 ================= */
var focusT=new THREE.Vector3(),focusCam=new THREE.Vector3(),focusUntil=0;
function fitCamera(){
  if(!state.books.length)return;
  var c=new THREE.Vector3(),n=state.books.length;
  state.books.forEach(function(b){c.add(b.base);});
  c.divideScalar(n);
  var maxR=0,ymin=Infinity,ymax=-Infinity;
  state.books.forEach(function(b){
    var d=b.base.distanceTo(c);
    if(d>maxR)maxR=d;
    if(b.base.y<ymin)ymin=b.base.y;
    if(b.base.y>ymax)ymax=b.base.y;
  });
  controls.target.copy(c);
  var yspan=Math.max(0.001,ymax-ymin);
  var dist=Math.max(12,maxR*2.1,yspan*1.45);
  camera.position.set(c.x,c.y+dist*0.3,c.z+dist);
  focusT.copy(c);focusCam.copy(camera.position);focusUntil=performance.now()+600;
}
function focusBook(id){
  var b=bookById(id);if(!b)return;
  focusT.copy(b.base);
  var off=camera.position.clone().sub(controls.target);
  focusCam.copy(b.base).add(off);
  focusUntil=performance.now()+1500;
}

/* ================= 选中与悬停 ================= */
function esc(s){
  var d=document.createElement('div');
  d.textContent=s;
  return d.innerHTML;
}
function pad(n){return String(n).padStart(2,'0');}
function setSelected(id){
  state.selId=id;
  if(id===null){
    selSpr.visible=false;infoCard.hidden=true;
  }else{
    var b=bookById(id);
    if(!b){selSpr.visible=false;infoCard.hidden=true;syncHlGeo();return;}
    selSpr.position.copy(b.pos);selSpr.visible=true;
    renderInfo(b);
  }
  syncHlGeo();
}
function renderInfo(b){
  var es=linkCache.filter(function(l){return l.from===b.id||l.to===b.id;});
  var ids=es.map(function(l){return l.from===b.id?l.to:l.from;});
  var d=new Date(b.addedAt);
  var relText;
  if(b.kind==='core')relText='中心节点';
  else if(b.kind==='peer')relText='并列于「'+(bookById(b.parentId)?bookById(b.parentId).title:'')+'」的环';
  else relText='包含于「'+(bookById(b.parentId)?bookById(b.parentId).title:'')+'」';
  var chips=ids.length?ids.map(function(id){
    var x=bookById(id);
    return '<button class="chip" data-focus="'+id+'">'+esc(x?x.title:'')+'</button>';
  }).join(''):'<span class="b-meta">暂无关联</span>';
  infoCard.innerHTML=
    '<button class="ic-close" id="icClose" aria-label="关闭">×</button>'+
    '<div class="ic-title">'+esc(b.title)+'</div>'+
    '<div class="ic-date">'+KIND_LABEL[b.kind]+' · 添加于 '+d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+'</div>'+
    '<div class="ic-rel">'+relText+'</div>'+
    '<div class="ic-sub">关联书籍</div>'+
    '<div class="chips">'+chips+'</div>';
  infoCard.hidden=false;
  var icc=document.getElementById('icClose');
  if(icc)icc.onclick=function(){setSelected(null);};
  var cs=infoCard.querySelectorAll('.chip');
  for(var i=0;i<cs.length;i++){
    (function(ch){ch.onclick=function(){focusBook(+ch.getAttribute('data-focus'));};})(cs[i]);
  }
}
var proj=new THREE.Vector3();
function positionTooltip(pos){
  proj.copy(pos).project(camera);
  var x=(proj.x*0.5+0.5)*window.innerWidth;
  var y=(-proj.y*0.5+0.5)*window.innerHeight;
  var lx=Math.min(Math.max(x,70),window.innerWidth-70);
  var ly=Math.min(Math.max(y,56),window.innerHeight-56);
  tooltip.style.left=lx+'px';tooltip.style.top=ly+'px';
}
function setHover(id){
  if(id===hoverId)return;
  hoverId=id;
  if(id===null){
    hoverSpr.visible=false;tooltip.hidden=true;sceneEl.style.cursor='grab';
  }else{
    var b=bookById(id);
    if(!b){setHover(null);return;}
    hoverSpr.position.copy(b.pos);hoverSpr.visible=true;
    sceneEl.style.cursor='pointer';
    var es=linkCache.filter(function(l){return l.from===id||l.to===id;});
    tooltip.innerHTML='<div>'+esc(b.title)+'</div><div class="tt-sub">'+KIND_LABEL[b.kind]+' · '+es.length+' 条关联</div>';
    tooltip.hidden=false;
    positionTooltip(b.pos);
  }
  syncHlGeo();
}
function ringAt(pos){
  ringSpr.position.copy(pos);
  ringSpr.scale.setScalar(0.3);
  ringSpr.material.opacity=1;
  ringLife=RING_DUR;
  ringSpr.visible=true;
}

/* ================= 拾取与交互 ================= */
var raycaster=new THREE.Raycaster();
raycaster.params.Points.threshold=0.7;
var pointer=new THREE.Vector2();
var dragging=false,lastRay=0;
controls.addEventListener('start',function(){dragging=true;});
controls.addEventListener('end',function(){dragging=false;});
function pick(cx,cy){
  var r=sceneEl.getBoundingClientRect();
  pointer.x=((cx-r.left)/r.width)*2-1;
  pointer.y=-((cy-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  var hits=raycaster.intersectObject(points,false);
  if(!hits.length)return null;
  var b=state.books[hits[0].index];
  return b?b.id:null;
}
sceneEl.addEventListener('pointermove',function(e){
  var now=performance.now();
  if(now-lastRay<55)return;
  lastRay=now;
  if(dragging){setHover(null);return;}
  setHover(pick(e.clientX,e.clientY));
});
sceneEl.addEventListener('pointerleave',function(){setHover(null);});
var downX=0,downY=0,rDown=false;
sceneEl.addEventListener('contextmenu',function(e){e.preventDefault();});
sceneEl.addEventListener('pointerdown',function(e){
  downX=e.clientX;downY=e.clientY;
  rDown=(e.button===2);
  if(e.button===0||e.button===2){
    try{sceneEl.setPointerCapture(e.pointerId);}catch(err){}
  }
  if(e.button===0)sceneEl.style.cursor='grabbing';
});
function endPointer(){
  rDown=false;
  sceneEl.style.cursor=(hoverId!==null)?'pointer':'grab';
}
sceneEl.addEventListener('pointerup',function(e){
  try{sceneEl.releasePointerCapture(e.pointerId);}catch(err){}
  var dx=e.clientX-downX,dy=e.clientY-downY;
  if(dx*dx+dy*dy>49){endPointer();return;}
  if(rDown){
    endPointer();
    var rid=pick(e.clientX,e.clientY);
    if(rid!==null){
      var rb=bookById(rid);
      setSelected(rid);focusBook(rid);
      toast('已将「'+rb.title+'」设为旋转中心');
    }
    return;
  }
  var id=pick(e.clientX,e.clientY);
  if(id!==null){setSelected(id);setHover(id);}
  else setSelected(null);
  endPointer();
});
sceneEl.addEventListener('pointercancel',function(e){
  try{sceneEl.releasePointerCapture(e.pointerId);}catch(err){}
  endPointer();
});

/* ================= 主循环 ================= */
var clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  var dt=Math.min(clock.getDelta(),0.05);
  var t=clock.elapsedTime;
  var now=performance.now();
  /* 节点向目标位置平滑过渡 + 微弱晃动 */
  var arr=points.geometry.getAttribute('position').array;
  var K=reduceMotion?0.25:0.07;
  for(var i=0;i<state.books.length;i++){
    var b=state.books[i];
    var tx=b.base.x,ty=b.base.y,tz=b.base.z;
    if(!reduceMotion){
      tx+=b.amp*Math.sin(t*b.freq+b.phase[0]);
      ty+=b.amp*Math.sin(t*b.freq*0.83+b.phase[1]);
      tz+=b.amp*Math.sin(t*b.freq*1.17+b.phase[2]);
    }
    b.pos.x+=(tx-b.pos.x)*K;
    b.pos.y+=(ty-b.pos.y)*K;
    b.pos.z+=(tz-b.pos.z)*K;
    arr[i*3]=b.pos.x;arr[i*3+1]=b.pos.y;arr[i*3+2]=b.pos.z;
  }
  points.geometry.getAttribute('position').needsUpdate=true;
  syncLinkGeo();
  syncFlashGeo(now);
  syncHlGeo();
  /* 新节点光圈 */
  if(ringLife>0){
    ringLife-=dt;
    if(ringLife<=0){ringSpr.visible=false;}
    else{
      var k=1-ringLife/RING_DUR;
      ringSpr.scale.setScalar(0.3+k*3.6);
      ringSpr.material.opacity=Math.max(0,1-k);
    }
  }
  /* 悬停/选中跟随 */
  if(hoverId!==null){
    var hb=bookById(hoverId);
    if(hb){hoverSpr.position.copy(hb.pos);positionTooltip(hb.pos);}
  }
  if(state.selId!==null){
    var sb=bookById(state.selId);
    if(sb)selSpr.position.copy(sb.pos);
    else setSelected(null);
  }
  /* 聚焦过渡 */
  if(now<focusUntil){
    controls.target.lerp(focusT,0.12);
    camera.position.lerp(focusCam,0.08);
  }
  controls.update();
  renderer.render(scene,camera);
}

/* ================= UI 更新 ================= */
function badgeHtml(k){
  return '<span class="badge '+k+'">'+KIND_LABEL[k]+'</span>';
}
function updateUI(){
  var n=state.books.length,m=linkCache.length;
  statsEl.innerHTML='<b>'+n+'</b> 节点 · <b>'+m+'</b> 条关联';
  listCount.textContent='('+n+')';
  emptyHint.hidden=n>0;
  if(n){
    var html='';
    for(var i=0;i<state.books.length;i++){
      var b=state.books[i];
      var es=linkCache.filter(function(l){return l.from===b.id||l.to===b.id;}).length;
      html+='<li data-id="'+b.id+'"><span class="b-dot"></span>'+badgeHtml(b.kind)+'<span class="b-title">'+esc(b.title)+'</span><span class="b-meta">'+es+' 关联</span><button class="rm" data-rm="'+b.id+'" aria-label="移除">×</button></li>';
    }
    bookList.innerHTML=html;
    var lis=bookList.querySelectorAll('li');
    for(var j=0;j<lis.length;j++){
      (function(li){
        li.onclick=function(e){
          if(e.target.closest('.rm'))return;
          focusBook(+li.getAttribute('data-id'));
        };
      })(lis[j]);
    }
    var rms=bookList.querySelectorAll('.rm');
    for(var k=0;k<rms.length;k++){
      (function(rm){
        rm.onclick=function(e){e.stopPropagation();removeBook(+rm.getAttribute('data-rm'));};
      })(rms[k]);
    }
  }else{
    bookList.innerHTML='<li class="b-meta" style="border:none;cursor:default;padding:6px 2px">暂无节点</li>';
  }
  /* 参照下拉 */
  var keepR=refSel.value;
  var ropts='<option value="">选择参照</option>';
  for(var p=0;p<state.books.length;p++){
    ropts+='<option value="'+state.books[p].id+'">'+esc(state.books[p].title)+'（'+KIND_LABEL[state.books[p].kind]+'）</option>';
  }
  refSel.innerHTML=ropts;
  if(keepR&&bookById(+keepR))refSel.value=keepR;
  refSel.disabled=kindSel.value==='core';
  /* 关联下拉 */
  var keepF=linkFrom.value,keepT=linkTo.value;
  var opts='<option value="">选择书籍</option>';
  for(var q=0;q<state.books.length;q++){
    opts+='<option value="'+state.books[q].id+'">'+esc(state.books[q].title)+'（'+KIND_LABEL[state.books[q].kind]+'）</option>';
  }
  linkFrom.innerHTML=opts;linkTo.innerHTML=opts;
  if(keepF&&bookById(+keepF))linkFrom.value=keepF;
  if(keepT&&bookById(+keepT))linkTo.value=keepT;
  linkBtn.disabled=n<2;
  renderSaves();
}
var toastTimer=0;
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');},2400);
}

/* ================= 事件绑定 ================= */
$('addBtn').onclick=addBook;
bookInput.addEventListener('keydown',function(e){if(e.key==='Enter')addBook();});
kindSel.addEventListener('change',function(){
  refSel.disabled=kindSel.value==='core';
  if(kindSel.value==='core')refSel.value='';
});
linkBtn.onclick=linkBooks;
drawerBtn.onclick=function(){
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden','false');
  drawerBtn.setAttribute('aria-expanded','true');
};
function closeDrawer(){
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');
  drawerBtn.setAttribute('aria-expanded','false');
}
drawerClose.onclick=closeDrawer;
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeDrawer();setSelected(null);setHover(null);}
});
$('clearBtn').onclick=clearAll;
$('sampleBtn').onclick=function(){loadSamples(false);};
$('saveBtn').onclick=function(){saveCurrentAs(saveName.value);};
saveName.addEventListener('keydown',function(e){if(e.key==='Enter')saveCurrentAs(saveName.value);});
$('newBtn').onclick=newNetwork;
function resize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}
window.addEventListener('resize',resize);

/* ================= 启动 ================= */
if(!load())loadSamples(true);
fitCamera();
resize();
updateUI();
frame();
})();
</script>
